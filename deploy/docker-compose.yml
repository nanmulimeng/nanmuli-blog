services:
  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: nanmuli-postgres:pgvector-zhparser
    container_name: nanmuli-postgres
    restart: always
    mem_limit: ${POSTGRES_MEM_LIMIT:-768m}
    cpus: ${POSTGRES_CPUS:-1.0}
    environment:
      POSTGRES_DB: nanmuli_blog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - nanmuli-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nanmuli_blog"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nanmuli-redis
    restart: always
    mem_limit: ${REDIS_MEM_LIMIT:-192m}
    cpus: ${REDIS_CPUS:-0.5}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - nanmuli-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nanmuli-backend
    restart: always
    mem_limit: ${BACKEND_MEM_LIMIT:-1024m}
    cpus: ${BACKEND_CPUS:-1.5}
    environment:
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError}
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nanmuli_blog
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}
      CRAWLER_SERVICE_URL: http://crawler:8500
      CRAWLER_API_KEY: ${CRAWLER_API_KEY:?set CRAWLER_API_KEY in deploy/.env}
      CRAWLER_CALLBACK_API_KEY: ${CRAWLER_CALLBACK_API_KEY:?set CRAWLER_CALLBACK_API_KEY in deploy/.env}
      CRAWLER_CALLBACK_URL: ${CRAWLER_CALLBACK_URL:-http://backend:8081/api/internal/collector/callback}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://nanmu.xyz,http://nanmu.xyz}
      BLOG_SECURITY_ENCRYPTION_KEY: ${BLOG_SECURITY_ENCRYPTION_KEY:?set BLOG_SECURITY_ENCRYPTION_KEY in deploy/.env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - nanmuli-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  crawler:
    build:
      context: ../crawler-service
      dockerfile: Dockerfile
    container_name: crawler-service
    restart: always
    mem_limit: ${CRAWLER_MEM_LIMIT:-1536m}
    cpus: ${CRAWLER_CPUS:-1.5}
    environment:
      PORT: 8500
      HOST: 0.0.0.0
      LOG_LEVEL: INFO
      AUTH_ENABLED: "true"
      API_KEYS: ${CRAWLER_API_KEY:?set CRAWLER_API_KEY in deploy/.env}
      JAVA_API_URL: ${JAVA_API_URL:-http://backend:8081}
      CALLBACK_URL: ${CALLBACK_URL:-http://backend:8081/api/internal/collector/callback}
      CALLBACK_API_KEY: ${CRAWLER_CALLBACK_API_KEY:?set CRAWLER_CALLBACK_API_KEY in deploy/.env}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_MODEL: ${AI_MODEL:-qwen-plus}
      DIGEST_ENABLED: ${DIGEST_ENABLED:-false}
      MAX_CONCURRENT_CRAWLS: ${MAX_CONCURRENT_CRAWLS:-2}
      DIGEST_PARALLEL_SECTIONS: ${DIGEST_PARALLEL_SECTIONS:-1}
      DIGEST_GLOBAL_TIMEOUT: ${DIGEST_GLOBAL_TIMEOUT:-420}
      SEARCH_CRAWL_DEADLINE_SECONDS: ${SEARCH_CRAWL_DEADLINE_SECONDS:-180}
      AI_DIGEST_TOTAL_BUDGET: ${AI_DIGEST_TOTAL_BUDGET:-60000}
      PROXY_URL: ${PROXY_URL:-}
    volumes:
      - crawler_data:/app/data
    ports:
      - "127.0.0.1:8500:8500"
    networks:
      - nanmuli-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport json, urllib.request\nresp = urllib.request.urlopen('http://localhost:8500/health', timeout=3)\nraise SystemExit(0 if json.load(resp).get('status') == 'healthy' else 1)\nPY"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: nanmuli-frontend
    restart: always
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    cpus: ${FRONTEND_CPUS:-0.5}
    ports:
      - "80:80"
    networks:
      - nanmuli-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  nanmuli-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  crawler_data:
  backend_uploads:
  backend_logs:
