spring:
  application:
    name: nanmuli-blog
  profiles:
    active: dev
  cache:
    type: redis
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
  flyway:
    # B15-04: Flyway 接入就绪，默认关闭（避免影响现有 Docker schema.sql 建库）。
    # 启用需真实 PG 预发验证 baseline 行为后 flip 为 true，步骤见 docs/flyway-migration-plan.md
    enabled: false
    baseline-on-migrate: true
    baseline-version: 1.0.23
    validate-on-migrate: false  # 容忍 V1_1~V1_23 与 schema.sql 的历史漂移（baseline 不执行它们）
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 8081
  compression:
    enabled: true

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1            # 无活动超时限制（个人博客无需强制登出）
  is-concurrent: false      # 单点登录（从true改为false）
  is-share: false
  token-style: uuid
  is-log: false
  # Cookie模式配置 - 防止XSS盗取Token
  token-from-cookie: true
  cookie:
    http-only: true
    secure: false
    same-site: Lax
  # Redis 持久化配置 - 各环境在 application-{profile}.yml 中覆盖

# MyBatis-Plus
mybatis-plus:
  type-handlers-package: com.nanmuli.blog.infrastructure.config.db
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: true
      logic-not-delete-value: false
      id-type: assign_id
  mapper-locations: classpath*:/mapper/**/*.xml

# 博客业务配置
blog:
  file:
    upload-path: ./uploads
    access-url: /uploads/
    max-size: 10485760
    allowed-extensions: jpg,jpeg,png,gif,webp,txt,md,pdf,zip,rar,7z
    storage-type: local
