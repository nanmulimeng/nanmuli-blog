name: CI

# X04-06: 最小 CI——把 backend / frontend 验证从"手动跑 release-gate"变成 PR/push 自动触发。
# crawler job 暂 continue-on-error：crawl4ai/playwright 重依赖 + 4 个 organize/keyword 503 既有失败
# （is_available 触发 Crawl4AI 探测在测试环境误判），待 X03 深入修复后转必须。

on:
  push:
    branches: [master, codex/digest-generation-closure]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Maven test
        run: mvn -f backend/pom.xml test -B

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  crawler:
    name: Crawler (pytest)
    runs-on: ubuntu-latest
    continue-on-error: true  # 4 个 organize/keyword 503 既有失败已修（mock is_available，本地 82 passed）；CI crawl4ai/playwright 环境待验证，暂 continue-on-error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: crawler-service/requirements.txt
      - name: Install deps
        run: pip install -r crawler-service/requirements.txt
      - name: Pytest
        run: |
          cd crawler-service
          python -m pytest -q --tb=short
